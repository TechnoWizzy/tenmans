version: '3'

dotenv:
  - .env

vars:
  CONFIG: compose.yml

tasks:
  # Default task: build and run
  default:
    desc: Build and run all containers
    cmds:
      - task: build
      - task: run

  # Build images
  build:
    desc: Build Docker images
    cmds:
      - docker compose -f {{.CONFIG}} build

  # Run containers (detached)
  run:
    desc: Run containers in detached mode and wait until healthy
    cmds:
      - docker compose -f {{.CONFIG}} up -d --wait

  # Run locally with the fetcher on localhost:3001
  dev:
    desc: Build and run all containers with compose.dev.yml overrides
    cmds:
      - docker compose -f {{.CONFIG}} -f compose.dev.yml up -d --build --wait

  # Show logs
  logs:
    desc: Show recent container logs
    cmds:
      - docker compose -f {{.CONFIG}} logs --tail 200

  # Stop and remove containers/networks
  stop:
    desc: Stop and remove containers
    cmds:
      - docker compose -f {{.CONFIG}} down

  # Stop and remove containers/networks/images/volumes
  clean:
    desc: Full cleanup (containers, images, orphans)
    cmds:
      - docker compose -f {{.CONFIG}} down --rmi all --remove-orphans