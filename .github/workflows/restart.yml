name: Daily Restart

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  restart:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Update Environment Variables
        run: |
          touch .env
          echo "${{ secrets.ENV }}" >> .env
          echo "COMMIT_MESSAGE='Executed Daily Restart'" >> .env

      - name: Restart Containers
        run: docker compose up -d --force-recreate --wait --wait-timeout 600

      - name: Show Container Logs
        if: failure()
        run: docker compose logs --tail 200 fetcher tenmans
